
<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Reunion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style id="base-css">
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--brand:'Playfair Display',serif;--f:'Inter','Noto Sans SC',system-ui,sans-serif;--ease:cubic-bezier(.4,0,.2,1)}
[data-theme="dark"]{
--bg0:#06081a;--bg1:#0a0e24;--bg2:#0e1330;--bg3:#141a38;
--sf1:#1c2348;--sf2:#222a54;
--b1:rgba(60,70,160,.2);--b2:rgba(80,90,180,.16);
--t1:#e4e6f8;--t2:#a0a8d0;--t3:#6268a0;--t4:#3e4470;
--ac:#4a7af5;--ac2:#9b6dff;
--acs:rgba(74,122,245,.1);--acs2:rgba(74,122,245,.06);
--red:#f06068;--grn:#3dd48a;
--ubbl:#1a1c32;
--glow:0 0 20px rgba(74,122,245,.1);
--sdw:0 2px 16px rgba(0,0,0,.3);--sdw2:0 8px 32px rgba(0,0,0,.4);
--code:#08081c;--glass:rgba(10,14,36,.88);
}
[data-theme="light"]{
--bg0:#f0f0fa;--bg1:#e6e6f4;--bg2:#f6f6fe;--bg3:#ffffff;
--sf1:#dcdaee;--sf2:#d0cee6;
--b1:rgba(80,70,160,.1);--b2:rgba(70,60,150,.08);
--t1:#101028;--t2:#3a3860;--t3:#7876a4;--t4:#a4a2c8;
--ac:#3a60d0;--ac2:#8050c0;
--acs:rgba(58,96,208,.08);--acs2:rgba(58,96,208,.04);
--red:#d04048;--grn:#1ea068;
--ubbl:#e2e0f0;
--glow:0 0 16px rgba(58,96,208,.06);
--sdw:0 2px 10px rgba(0,0,0,.06);--sdw2:0 8px 28px rgba(0,0,0,.1);
--code:#eeeef6;--glass:rgba(255,255,255,.88);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--f);background:var(--bg0);color:var(--t1);transition:background .3s,color .3s;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b1);border-radius:3px}
::selection{background:var(--acs);color:var(--ac)}
input,textarea,select,button{font-family:inherit}
.app{display:flex;height:100vh}
.sidebar{width:260px;min-width:260px;background:var(--bg1);display:flex;flex-direction:column;z-index:200;position:relative;transition:transform .3s var(--ease)}
.sidebar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--b1) 20%,var(--b1) 80%,transparent)}
.s-head{padding:20px 16px 14px}
.brand-row{display:flex;align-items:center;gap:4px;margin-bottom:14px}
.brand{font-family:var(--brand);font-size:22px;font-weight:700;letter-spacing:1px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pulse{width:5px;height:5px;border-radius:50%;background:var(--ac2);box-shadow:0 0 6px var(--ac),0 0 12px var(--ac2);animation:pulse 2.5s ease-in-out infinite;margin-top:-10px;margin-left:1px}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.25;transform:scale(.6)}}
.s-close{display:none;background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:4px;margin-left:auto}
.s-close:hover{color:var(--t1)}
.s-new{width:100%;padding:10px;border:none;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .2s;box-shadow:0 3px 14px rgba(74,122,245,.2),0 3px 14px rgba(155,109,255,.15)}
.s-new:hover{transform:translateY(-1px);box-shadow:0 5px 20px rgba(74,122,245,.3),0 5px 20px rgba(155,109,255,.2)}
.chat-list{flex:1;overflow-y:auto;padding:4px 8px}
.cl-date{font-size:10px;color:var(--t4);padding:10px 10px 4px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
.cl-item{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .12s;margin-bottom:1px;position:relative}
.cl-item:hover,.cl-item:active{background:var(--acs)}
.cl-item.on{background:var(--acs)}
.cl-item.on::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(180deg,var(--ac),var(--ac2))}
.cl-item .ci{font-size:11px;color:var(--t4);width:14px;text-align:center}
.cl-item.on .ci{color:var(--ac)}
.cl-item .ct{flex:1;font-size:13px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-item.on .ct{color:var(--t1);font-weight:500}
/* 修复1: 删除按钮始终可点击，默认低透明度 */
.cl-item .cx{opacity:.2;background:none;border:none;color:var(--t4);cursor:pointer;padding:6px;font-size:11px;transition:opacity .12s,color .12s}
.cl-item:hover .cx,.cl-item:active .cx{opacity:.6}
.cl-item .cx:hover,.cl-item .cx:active{color:var(--red);opacity:1}
.cl-item .cx.confirm{opacity:1!important;color:var(--red)!important;animation:headShake .4s}
@keyframes headShake{0%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}100%{transform:translateX(0)}}
.s-foot{padding:6px 10px 10px;display:flex;flex-direction:column;gap:1px}
.s-foot::before{content:'';display:block;height:1px;background:linear-gradient(90deg,transparent 10%,var(--b1) 50%,transparent 90%);margin:0 6px 4px}
.sf{width:100%;padding:8px 12px;background:none;border:none;border-radius:8px;color:var(--t3);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:9px;transition:all .12s;text-align:left}
.sf:hover,.sf:active{background:var(--acs);color:var(--t2)}
.sf i{width:15px;text-align:center;font-size:12px}
.sf .badge{margin-left:auto;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:8px;min-width:16px;text-align:center}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{padding:0 14px;height:46px;display:flex;align-items:center;gap:8px;background:var(--glass);backdrop-filter:blur(16px);flex-shrink:0;position:relative;z-index:10}
.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--b1),transparent)}
.tb-m{display:none;background:none;border:none;color:var(--t2);font-size:17px;cursor:pointer;padding:6px;border-radius:6px}
.tb-m:hover{background:var(--acs)}
.tb-t{flex:1;font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--t2)}
.tb-i{width:32px;height:32px;border-radius:50%;background:var(--acs);border:none;color:var(--t3);cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.tb-i:hover{color:var(--t1);background:var(--sf1)}
.msg-w{flex:1;overflow-y:auto;padding:16px 0}
.msg-i{max-width:100%;margin:0 auto}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding-top:50px}
.greet{font-family:var(--brand);font-size:26px;font-weight:500;letter-spacing:.5px;text-align:center;line-height:1.5;font-style:italic;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.message{padding:5px 0}
.msg-row{max-width:780px;margin:0 auto;padding:0 14px;display:flex;gap:8px}
.message.u .msg-row{flex-direction:row-reverse}
.m-av{width:30px;height:30px;min-width:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;overflow:hidden;flex-shrink:0;margin-top:2px}
.m-av.uav{background:linear-gradient(135deg,rgba(74,122,245,.15),rgba(155,109,255,.1));color:var(--ac)}
.m-av.aav{background:var(--sf1);color:var(--t3)}
.m-av img{width:100%;height:100%;object-fit:cover}
.m-body{flex:1;min-width:0;display:flex;flex-direction:column}
.message.u .m-body{align-items:flex-end}
.m-head{display:flex;align-items:baseline;gap:6px;margin-bottom:3px}
.message.u .m-head{flex-direction:row-reverse}
.m-name{font-size:11px;font-weight:500;color:var(--t3)}
.m-model{font-size:9px;color:var(--t4);padding:1px 6px;background:var(--acs2);border-radius:5px}
.m-time{font-size:9px;color:var(--t4)}
.m-text{font-size:14px;line-height:1.75;color:var(--t2);word-break:break-word}
.message.u .m-text{background:var(--ubbl);padding:9px 13px;border-radius:16px 16px 4px 16px;color:var(--t1);max-width:88%;text-align:left}
.m-text p{margin-bottom:6px}.m-text p:last-child{margin-bottom:0}
.m-text pre{background:var(--code);border-radius:8px;padding:12px;margin:8px 0;overflow-x:auto;font-size:12px}
.m-text code{font-family:'Fira Code','SF Mono',monospace;font-size:12px}
.m-text code:not(pre code){background:var(--sf1);padding:1px 5px;border-radius:4px;font-size:11px;color:var(--ac)}
.m-text ul,.m-text ol{padding-left:18px;margin:5px 0}
.m-text blockquote{border-left:3px solid var(--ac);padding:5px 12px;color:var(--t3);margin:6px 0;background:var(--acs2);border-radius:0 6px 6px 0}
.m-text table{border-collapse:collapse;margin:6px 0;width:100%}
.m-text th,.m-text td{border:1px solid var(--b1);padding:5px 8px;font-size:12px}
.m-text th{background:var(--sf1)}
.m-text a{color:var(--ac)}.m-text a:hover{text-decoration:underline}
.m-text img{max-width:100%;border-radius:8px}
.m-files{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.m-file{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;background:var(--acs);border-radius:6px;font-size:10px;color:var(--t2)}
.m-file img{width:28px;height:28px;object-fit:cover;border-radius:4px}
.m-acts{display:flex;gap:3px;margin-top:3px;opacity:0;transition:opacity .12s}
.message:hover .m-acts,.message:active .m-acts{opacity:1}
.ma{padding:3px 8px;font-size:10px;border:none;border-radius:5px;background:var(--acs);color:var(--t3);cursor:pointer;display:inline-flex;align-items:center;gap:3px;transition:all .12s}
.ma:hover{background:var(--sf1);color:var(--t1)}
.ma.rd:hover{color:var(--red);background:rgba(240,96,104,.06)}
.ebox{margin-top:5px;display:none;width:100%;max-width:88%}.ebox.show{display:block}
.message.u .ebox{margin-left:auto}
.ebox textarea{width:100%;min-height:50px;padding:8px;background:var(--bg2);border:1px solid var(--b2);border-radius:8px;color:var(--t1);font-size:13px;resize:vertical;line-height:1.6;outline:none}
.ebox textarea:focus{border-color:var(--ac);box-shadow:var(--glow)}
.ebox-b{display:flex;gap:5px;justify-content:flex-end;margin-top:5px}
.eb-ok{padding:5px 14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:12px}
.eb-no{padding:5px 14px;background:var(--sf1);color:var(--t2);border:none;border-radius:6px;cursor:pointer;font-size:12px}
.bdg-s{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;background:var(--acs);border-radius:12px;font-size:10px;color:var(--ac);margin-bottom:6px;font-weight:500}
.bdg-m{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 10px;background:rgba(61,212,138,.08);border-radius:12px;font-size:10px;color:var(--grn);font-weight:500}
.think{margin-bottom:6px;border-radius:8px;overflow:hidden;background:var(--acs2)}
.think-h{padding:7px 10px;cursor:pointer;font-size:11px;color:var(--t3);display:flex;align-items:center;gap:5px;user-select:none}
.think-h:hover{color:var(--t2)}
.think-h i.ar{transition:transform .2s;font-size:9px}.think-h.on i.ar{transform:rotate(90deg)}
.think-b{max-height:0;overflow:hidden;transition:max-height .4s var(--ease),padding .3s;font-size:12px;color:var(--t3);line-height:1.7;white-space:pre-wrap;padding:0 10px}
.think-b.on{max-height:5000px;padding:0 10px 8px;overflow-y:auto}
.gen{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;color:var(--t3)}
.gd{display:flex;gap:3px}
.gd span{width:5px;height:5px;background:var(--ac);border-radius:50%;animation:dp 1.4s ease-in-out infinite}
.gd span:nth-child(2){animation-delay:.2s}.gd span:nth-child(3){animation-delay:.4s}
@keyframes dp{0%,80%,100%{opacity:.2;transform:scale(.7)}40%{opacity:1;transform:scale(1.1)}}
.cur{display:inline-block;width:2px;height:14px;background:var(--ac);margin-left:2px;vertical-align:text-bottom;animation:bk 1s step-end infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
.in-area{flex-shrink:0;position:relative;background:var(--bg0)}
.in-area::before{content:'';position:absolute;top:0;left:8%;right:8%;height:1px;background:linear-gradient(90deg,transparent,var(--b1),transparent)}
.resize-h{height:12px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none}
.resize-h::after{content:'';width:24px;height:3px;background:var(--b1);border-radius:2px;transition:all .15s}
.resize-h:hover::after{background:var(--ac);width:32px}
.in-inner{max-width:780px;margin:0 auto;padding:0 12px 12px}
.active-tags{display:flex;gap:4px;margin-bottom:5px;flex-wrap:wrap}
.active-tags:empty{display:none}
.at{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--acs);color:var(--ac);display:flex;align-items:center;gap:3px;font-weight:500}
.f-bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:5px}.f-bar:empty{display:none}
.fc{display:flex;align-items:center;gap:3px;padding:3px 7px;background:var(--acs);border-radius:5px;font-size:10px;color:var(--t2)}
.fc img{width:16px;height:16px;object-fit:cover;border-radius:3px}
.fc-x{background:none;border:none;color:var(--t4);cursor:pointer;font-size:9px;padding:0 2px}.fc-x:hover{color:var(--red)}
.inbox{display:flex;align-items:flex-end;gap:5px;background:var(--bg3);border-radius:14px;padding:5px 6px 5px 5px;box-shadow:var(--sdw);transition:box-shadow .3s}
.inbox:focus-within{box-shadow:var(--glow),var(--sdw)}
.plus-w{position:relative;flex-shrink:0}
.plus-btn{width:34px;height:34px;border-radius:9px;background:var(--acs);border:none;color:var(--t3);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
.plus-btn:hover{color:var(--ac);background:var(--sf1)}
.plus-btn.open{transform:rotate(45deg);color:var(--ac)}
.plus-pop{position:absolute;bottom:calc(100% + 6px);left:0;min-width:160px;background:var(--bg3);border-radius:10px;box-shadow:var(--sdw2);padding:4px;opacity:0;transform:translateY(6px) scale(.95);pointer-events:none;transition:all .2s var(--ease);z-index:50}
.plus-pop.open{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}
.pp-item{display:flex;align-items:center;gap:7px;padding:9px 11px;border-radius:7px;border:none;background:none;color:var(--t2);cursor:pointer;font-size:12px;width:100%;text-align:left;transition:background .12s}
.pp-item:hover,.pp-item:active{background:var(--acs)}
.pp-item i{width:15px;text-align:center;font-size:12px;color:var(--t3)}
.pp-div{height:1px;background:linear-gradient(90deg,transparent,var(--b1),transparent);margin:3px 8px}
.pp-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--t4);transition:background .2s}
.pp-dot.on{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.inbox textarea{flex:1;border:none;background:none;color:var(--t1);font-size:14px;resize:none;outline:none;min-height:44px;max-height:260px;line-height:1.5;padding:7px 4px}
.inbox textarea::placeholder{color:var(--t4)}
.sndbtn{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;box-shadow:0 2px 8px rgba(74,122,245,.15),0 2px 8px rgba(155,109,255,.1)}
.sndbtn:hover{transform:scale(1.05)}
.sndbtn.stop{background:linear-gradient(135deg,var(--red),#d04050);box-shadow:0 2px 8px rgba(240,96,104,.2)}
.pov{position:fixed;inset:0;background:rgba(6,8,26,.55);backdrop-filter:blur(6px);z-index:300;opacity:0;pointer-events:none;transition:opacity .3s}
.pov.open{opacity:1;pointer-events:auto}
.panel{position:fixed;right:-100%;top:0;bottom:0;width:88%;max-width:340px;background:var(--bg1);z-index:310;display:flex;flex-direction:column;transition:right .35s var(--ease);box-shadow:var(--sdw2)}
.panel.open{right:0}
.p-head{padding:16px 14px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.p-head h3{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.p-head h3 i{color:var(--ac);font-size:13px}
.p-x{background:none;border:none;color:var(--t3);font-size:15px;cursor:pointer;padding:6px;border-radius:6px}
.p-x:hover{color:var(--t1);background:var(--acs)}
.mp-add{padding:0 12px 8px;display:flex;gap:5px}
.mp-add-in{flex:1;padding:8px 10px;background:var(--bg2);border:1px solid var(--b1);border-radius:8px;color:var(--t1);font-size:12px;outline:none}
.mp-add-in:focus{border-color:var(--ac)}
.mp-add-in::placeholder{color:var(--t4)}
.mp-add-btn{padding:8px 10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.mp-bar{padding:0 12px 8px;display:flex;gap:4px}
.mpb{padding:5px 9px;font-size:11px;background:var(--acs);border:none;border-radius:6px;color:var(--t3);cursor:pointer;display:flex;align-items:center;gap:3px;transition:all .12s}
.mpb:hover{background:var(--sf1);color:var(--t1)}
.p-list{flex:1;overflow-y:auto;padding:4px 10px 12px}
.mi{display:flex;align-items:flex-start;gap:6px;padding:8px;margin-bottom:3px;background:var(--bg2);border-radius:7px;font-size:12px;line-height:1.6;color:var(--t2)}
.mi:hover{background:var(--bg3)}
.mi-t{flex:1;word-break:break-word}
.mi-d{background:none;border:none;color:var(--t4);cursor:pointer;font-size:10px;padding:2px;flex-shrink:0}
.mi-d:hover{color:var(--red)}
.p-empty{text-align:center;padding:30px 12px;color:var(--t4);font-size:12px;line-height:2}
.p-empty i{font-size:22px;display:block;margin-bottom:5px;opacity:.25}
.mbg{position:fixed;inset:0;background:rgba(6,8,26,.65);backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.mbg.open{opacity:1;pointer-events:auto}
.mdl{background:var(--bg1);border-radius:18px 18px 0 0;width:100%;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sdw2);transform:translateY(100%);transition:transform .35s var(--ease);overflow:hidden}
.mbg.open .mdl{transform:translateY(0)}
.mdl-h{padding:16px 18px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.mdl-h h2{font-size:16px;font-weight:700;display:flex;align-items:center;gap:7px}
.mdl-h h2 i{font-size:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.mx{background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:6px;border-radius:6px}
.mx:hover{color:var(--t1);background:var(--acs)}
.mdl-bar{width:36px;height:4px;background:var(--b1);border-radius:3px;margin:8px auto 0}
.mdl-tabs{display:flex;padding:0 16px;flex-shrink:0;position:relative;overflow-x:auto}
.mdl-tabs::-webkit-scrollbar{display:none}
.mdl-tabs::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--b1),transparent)}
.mt{padding:8px 12px;font-size:13px;color:var(--t3);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;font-weight:500;white-space:nowrap}
.mt:hover{color:var(--t2)}.mt.on{color:var(--ac);border-bottom-color:var(--ac)}
.mdl-body{flex:1;overflow-y:auto;padding:16px 18px}
.tc{display:none}.tc.on{display:block}
.sg{margin-bottom:12px}
.sg-l{font-size:12px;color:var(--t3);margin-bottom:4px;display:block;font-weight:500}
.sg-i{width:100%;padding:9px 10px;background:var(--bg2);border:1px solid var(--b1);border-radius:8px;color:var(--t1);font-size:13px;outline:none;transition:all .2s}
.sg-i:focus{border-color:var(--ac);box-shadow:var(--glow)}
textarea.sg-i{min-height:64px;resize:vertical;line-height:1.6}
.sg-r{display:flex;gap:10px}.sg-r .sg{flex:1}
.sg-h{font-size:10px;color:var(--t4);margin-top:3px}
.av-card{padding:12px;background:var(--bg2);border-radius:10px;display:flex;align-items:center;gap:12px}
.av-img{width:46px;height:46px;border-radius:12px;background:var(--sf1);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:18px;color:var(--t4);flex-shrink:0}
.av-img img{width:100%;height:100%;object-fit:cover}
.av-inf{flex:1;display:flex;flex-direction:column;gap:5px}
.av-btn{padding:5px 10px;background:var(--acs);border:none;border-radius:6px;color:var(--ac);cursor:pointer;font-size:11px;font-weight:500;display:inline-flex;align-items:center;gap:3px;align-self:flex-start}
.av-btn:hover{background:var(--sf1)}
.mdl-ft{padding:10px 18px;display:flex;justify-content:flex-end;gap:6px;flex-shrink:0;position:relative}
.mdl-ft::before{content:'';position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,var(--b1),transparent)}
.btn-ok{padding:9px 24px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;box-shadow:0 2px 8px rgba(74,122,245,.15),0 2px 8px rgba(155,109,255,.1)}
.btn-no{padding:9px 18px;background:var(--sf1);color:var(--t2);border:none;border-radius:8px;cursor:pointer;font-size:13px}
.btn-no:hover{background:var(--sf2);color:var(--t1)}

/* 修复2: 日历色块用固定尺寸，不依赖 aspect-ratio */
.cal-scroll{flex:1;overflow-y:auto;padding:0 18px;min-height:0}
.cal-mo{margin-bottom:20px}
.cal-mo-t{font-size:13px;font-weight:600;color:var(--t1);text-align:center;margin-bottom:6px;position:sticky;top:0;background:var(--bg1);padding:6px 0;z-index:1}
.cal-mg{display:grid;grid-template-columns:repeat(7,26px);gap:3px;justify-content:center}
.cal-mhd{height:18px;font-size:9px;color:var(--t4);display:flex;align-items:center;justify-content:center;font-weight:600}
.cal-mc{width:26px;height:26px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--t3);cursor:default;transition:background .15s}
.cal-mc.empty{background:transparent}
.cal-mc.l0{background:var(--acs2)}
.cal-mc.l1{background:rgba(74,122,245,.2)}
.cal-mc.l2{background:rgba(96,108,240,.38)}
.cal-mc.l3{background:rgba(130,90,230,.55)}
.cal-mc.l4{background:rgba(155,109,255,.75);color:#fff}
.cal-mc.today{box-shadow:inset 0 0 0 1.5px var(--ac);font-weight:700;color:var(--ac)}
.cal-mc.l4.today{color:#fff}
.cal-mc.active{box-shadow:inset 0 0 0 1.5px var(--ac2)}
.cal-info{text-align:center;font-size:11px;color:var(--t3);min-height:20px;padding:4px 18px;flex-shrink:0}
.cal-fix{flex-shrink:0;padding:0 18px 14px;border-top:1px solid var(--b1)}
.cal-legend{display:flex;align-items:center;justify-content:center;gap:3px;padding:8px 0;font-size:9px;color:var(--t4)}
.cal-legend span{width:10px;height:10px;border-radius:2px}
.anni-head{font-size:12px;font-weight:600;color:var(--t2);margin-bottom:8px;display:flex;align-items:center;gap:5px}
.anni-head i{font-size:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.anni-list{max-height:130px;overflow-y:auto;margin-bottom:8px}
.anni-item{display:flex;align-items:center;gap:6px;padding:7px 8px;margin-bottom:3px;background:var(--bg2);border-radius:7px;font-size:11px;color:var(--t2)}
.anni-item .ai-dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));flex-shrink:0}
.anni-item .ai-name{flex:1}
.anni-item .ai-days{color:var(--ac);font-size:10px;white-space:nowrap;font-weight:600}
.anni-item .ai-del{background:none;border:none;color:var(--t4);cursor:pointer;font-size:9px;padding:4px}
.anni-item .ai-del:hover{color:var(--red)}
.anni-add{display:flex;gap:5px;align-items:center}
.anni-add input{padding:6px 8px;background:var(--bg2);border:1px solid var(--b1);border-radius:6px;color:var(--t1);font-size:11px;outline:none}
.anni-add input:focus{border-color:var(--ac)}
.anni-add input[type=text]{flex:1;min-width:0}
.anni-add input[type=date]{width:110px;font-family:var(--f)}
.anni-add button{padding:6px 10px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;white-space:nowrap}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:8px 20px;background:var(--glass);backdrop-filter:blur(16px);border-radius:8px;font-size:12px;color:var(--t1);box-shadow:var(--sdw);z-index:9999;animation:tIn .3s var(--ease);transition:opacity .3s}
@keyframes tIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.s-ov{display:none;position:fixed;inset:0;background:rgba(6,8,26,.5);z-index:190;backdrop-filter:blur(4px)}
.s-ov.open{display:block}
.sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);z-index:200;box-shadow:var(--sdw2)}
.sidebar.open{transform:translateX(0)}
.tb-m{display:inline-flex}.s-close{display:inline-flex}
@media(min-width:769px){
  .sidebar{position:relative;transform:none;box-shadow:none}
  .tb-m{display:none}.s-close{display:none}
  .s-ov{display:none!important}
  .msg-row{padding:0 24px}.in-inner{padding:0 24px 14px}
  .mbg{align-items:center}
  .mdl{border-radius:18px;max-width:520px;max-height:85vh}
  .panel{max-width:340px;width:340px;right:-340px}
}
</style>
<style id="custom-css"></style>
</head>
<body>
<div class="app">
<div class="s-ov" id="sov" onclick="closeSide()"></div>
<aside class="sidebar" id="sidebar">
  <div class="s-head">
    <div class="brand-row"><span class="brand">Reunion</span><span class="pulse"></span><button class="s-close" onclick="closeSide()"><i class="fas fa-times"></i></button></div>
    <button class="s-new" onclick="newChat()"><i class="fas fa-plus"></i> 新建对话</button>
  </div>
  <div class="chat-list" id="chatList"></div>
  <div class="s-foot">
    <button class="sf" onclick="openCal()"><i class="fas fa-heart"></i> 陪伴密度</button>
    <button class="sf" onclick="openMem()"><i class="fas fa-brain"></i> 记忆库 <span class="badge" id="memB">0</span></button>
    <button class="sf" onclick="openSettings()"><i class="fas fa-cog"></i> 设置</button>
    <button class="sf" onclick="exportData()"><i class="fas fa-download"></i> 导出备份</button>
    <label class="sf" style="cursor:pointer"><i class="fas fa-upload"></i> 导入备份<input type="file" accept=".json" hidden onchange="importData(event)"></label>
  </div>
</aside>
<main class="main">
  <div class="topbar">
    <button class="tb-m" onclick="openSide()"><i class="fas fa-bars"></i></button>
    <div class="tb-t" id="tbT">新对话</div>
    <button class="tb-i" onclick="toggleTheme()" id="tTh"><i class="fas fa-moon"></i></button>
  </div>
  <div class="msg-w" id="msgW"><div class="msg-i" id="msgI"></div></div>
  <div class="in-area" id="inArea">
    <div class="resize-h" id="resizeH"></div>
    <div class="in-inner">
      <div class="active-tags" id="aTags"></div>
      <div class="f-bar" id="fBar"></div>
      <div class="inbox">
        <div class="plus-w">
          <button class="plus-btn" id="plusBtn" onclick="togglePlus()"><i class="fas fa-plus"></i></button>
          <div class="plus-pop" id="plusPop">
            <button class="pp-item" onclick="Q('#imgIn').click();closePlus()"><i class="fas fa-image"></i> 上传图片</button>
            <button class="pp-item" onclick="Q('#fIn').click();closePlus()"><i class="fas fa-paperclip"></i> 上传文件</button>
            <div class="pp-div"></div>
            <button class="pp-item" onclick="tog('s')"><i class="fas fa-globe"></i> 联网搜索 <span class="pp-dot" id="dotS"></span></button>
            <button class="pp-item" onclick="tog('t')"><i class="fas fa-lightbulb"></i> 深度思考 <span class="pp-dot" id="dotT"></span></button>
          </div>
        </div>
        <textarea id="uIn" rows="1" placeholder="输入消息…"></textarea>
        <button class="sndbtn" id="sendBtn" onclick="onSendClick()"><i class="fas fa-arrow-up"></i></button>
      </div>
      <input type="file" id="imgIn" accept="image/*" multiple hidden onchange="pickFile(this,true)">
      <input type="file" id="fIn" multiple hidden onchange="pickFile(this,false)">
    </div>
  </div>
</main>
</div>

<div class="pov" id="memOv" onclick="closeMem()"></div>
<div class="panel" id="memP">
  <div class="p-head"><h3><i class="fas fa-brain"></i> 记忆库</h3><button class="p-x" onclick="closeMem()"><i class="fas fa-times"></i></button></div>
  <div class="mp-add"><input class="mp-add-in" id="memIn" placeholder="手动添加记忆…" onkeydown="if(event.key==='Enter'){event.preventDefault();addMemM()}"><button class="mp-add-btn" onclick="addMemM()">添加</button></div>
  <div class="mp-bar"><button class="mpb" onclick="compMem()"><i class="fas fa-compress"></i> 压缩</button><button class="mpb" onclick="clearMem()"><i class="fas fa-trash"></i> 清空</button></div>
  <div class="p-list" id="memL"></div>
</div>

<div class="mbg" id="calBg">
  <div class="mdl">
    <div class="mdl-bar"></div>
    <div class="mdl-h"><h2><i class="fas fa-heart"></i> 陪伴密度</h2><button class="mx" onclick="closeCal()"><i class="fas fa-times"></i></button></div>
    <div class="cal-scroll" id="calScroll"></div>
    <div class="cal-info" id="calInfo"></div>
    <div class="cal-fix">
      <div class="cal-legend">少 <span style="background:var(--acs2)"></span><span style="background:rgba(74,122,245,.2)"></span><span style="background:rgba(96,108,240,.38)"></span><span style="background:rgba(130,90,230,.55)"></span><span style="background:rgba(155,109,255,.75)"></span> 多</div>
      <div class="anni-head"><i class="fas fa-star"></i> 纪念日</div>
      <div class="anni-list" id="anniList"></div>
      <div class="anni-add">
        <input type="text" id="anniName" placeholder="名称">
        <input type="date" id="anniDate">
        <button onclick="addAnni()"><i class="fas fa-plus"></i></button>
      </div>
    </div>
  </div>
</div>

<div class="mbg" id="sBg">
  <div class="mdl">
    <div class="mdl-bar"></div>
    <div class="mdl-h"><h2>设置</h2><button class="mx" onclick="closeS()"><i class="fas fa-times"></i></button></div>
    <div class="mdl-tabs">
      <div class="mt on" data-t="api" onclick="stab(this)">API</div>
      <div class="mt" data-t="prompt" onclick="stab(this)">指令</div>
      <div class="mt" data-t="profile" onclick="stab(this)">个性化</div>
      <div class="mt" data-t="beauty" onclick="stab(this)">美化</div>
    </div>
    <div class="mdl-body">
      <div class="tc on" id="t-api">
        <div class="sg"><label class="sg-l">API 地址</label><input class="sg-i" id="i_base" placeholder="https://api.openai.com/v1"></div>
        <div class="sg"><label class="sg-l">API 密钥</label><input class="sg-i" id="i_key" type="password" placeholder="sk-..."></div>
        <div class="sg"><label class="sg-l">模型列表</label><textarea class="sg-i" id="i_models" rows="3" placeholder="gpt-4o&#10;deepseek-chat"></textarea></div>
        <div class="sg"><label class="sg-l">当前模型</label><select class="sg-i" id="i_model"></select></div>
        <div class="sg-r"><div class="sg"><label class="sg-l">Max Tokens</label><input class="sg-i" id="i_tok" type="number" value="4096"></div><div class="sg"><label class="sg-l">Temperature</label><input class="sg-i" id="i_temp" type="number" step="0.1" value="0.7"></div></div>
      </div>
      <div class="tc" id="t-prompt">
        <div class="sg"><label class="sg-l">全局系统指令</label><textarea class="sg-i" id="i_gsys" rows="5" placeholder="所有对话生效…"></textarea><div class="sg-h">对所有对话生效</div></div>
        <div class="sg"><label class="sg-l">当前对话指令</label><textarea class="sg-i" id="i_csys" rows="4" placeholder="仅当前对话…"></textarea><div class="sg-h">仅对当前对话生效</div></div>
      </div>
      <div class="tc" id="t-profile">
        <div class="sg"><label class="sg-l" style="margin-bottom:6px">用户</label><div class="av-card"><div class="av-img" id="p_uAv"><i class="fas fa-user"></i></div><div class="av-inf"><input class="sg-i" id="p_uN" placeholder="你的名字"><button class="av-btn" onclick="Q('#p_uF').click()"><i class="fas fa-camera"></i> 头像</button><input type="file" id="p_uF" accept="image/*" hidden onchange="onAv(this,'u')"></div></div></div>
        <div class="sg"><label class="sg-l" style="margin-bottom:6px">助手</label><div class="av-card"><div class="av-img" id="p_aAv"><i class="fas fa-robot"></i></div><div class="av-inf"><input class="sg-i" id="p_aN" placeholder="助手"><button class="av-btn" onclick="Q('#p_aF').click()"><i class="fas fa-camera"></i> 头像</button><input type="file" id="p_aF" accept="image/*" hidden onchange="onAv(this,'a')"></div></div></div>
      </div>
      <div class="tc" id="t-beauty">
        <div class="sg"><label class="sg-l">自定义 CSS</label><textarea class="sg-i" id="i_css" rows="8" placeholder="/* 输入自定义CSS */&#10;[data-theme='dark'] {&#10;  --ac: #ff6b9d;&#10;  --ac2: #e85a8a;&#10;}" style="font-family:'Fira Code','SF Mono',monospace;font-size:11px;line-height:1.5;tab-size:2"></textarea><div class="sg-h">CSS代码覆盖默认样式，保存后生效</div></div>
        <div class="sg"><label class="sg-l">快捷预设</label>
          <div style="display:flex;gap:5px;flex-wrap:wrap">
            <button class="av-btn" onclick="presetCSS('rose')"><i class="fas fa-heart"></i> 玫瑰</button>
            <button class="av-btn" onclick="presetCSS('ocean')"><i class="fas fa-water"></i> 海洋</button>
            <button class="av-btn" onclick="presetCSS('forest')"><i class="fas fa-leaf"></i> 森林</button>
            <button class="av-btn" onclick="presetCSS('sunset')"><i class="fas fa-sun"></i> 日落</button>
            <button class="av-btn" onclick="presetCSS('clear')"><i class="fas fa-eraser"></i> 清除</button>
          </div>
          <div class="sg-h" style="margin-top:4px">点击预设填入CSS，需保存后生效</div>
        </div>
      </div>
    </div>
    <div class="mdl-ft"><button class="btn-no" onclick="closeS()">取消</button><button class="btn-ok" onclick="saveS()">保存</button></div>
  </div>
</div>

<script>
const Q=s=>document.querySelector(s),QQ=s=>document.querySelectorAll(s);
let S={theme:'dark',sOn:false,tOn:false,cfg:{base:'',key:'',models:['gpt-4o','gpt-4o-mini','deepseek-chat'],cur:'gpt-4o',tok:4096,temp:.7,uN:'',uA:'',aN:'助手',aA:'',gSys:''},mem:[],chats:{},cid:null,anni:[],css:''};
let busy=false,ctrl=null,pf=[],tmpA={u:'',a:''};

const CSS_PRESETS={
rose:`[data-theme="dark"]{--ac:#e8607a;--ac2:#ff8fa8;--bg0:#140a10;--bg1:#1c0e16;--bg2:#24121c;--bg3:#2e1826;--ubbl:#2a1420;--sf1:#3a1830;--sf2:#421e38}
[data-theme="light"]{--ac:#d04060;--ac2:#e870a0;--bg0:#faf0f2;--bg1:#f4e4e8;--bg2:#fef8fa;--bg3:#fff;--ubbl:#f0dce2;--sf1:#eedce2;--sf2:#e6d0d8}`,
ocean:`[data-theme="dark"]{--ac:#38bdf8;--ac2:#60d0ff;--bg0:#04101a;--bg1:#081620;--bg2:#0c1c2a;--bg3:#102436;--ubbl:#0c1c28;--sf1:#143040;--sf2:#183848}
[data-theme="light"]{--ac:#0284c7;--ac2:#30a8e0;--bg0:#f0f8ff;--bg1:#e0f0fc;--bg2:#f4faff;--bg3:#fff;--ubbl:#d8eef8;--sf1:#d0e8f4;--sf2:#c4e0f0}`,
forest:`[data-theme="dark"]{--ac:#4ade80;--ac2:#80f0a8;--bg0:#061408;--bg1:#0a1c0e;--bg2:#0e2414;--bg3:#142e1c;--ubbl:#0c1c10;--sf1:#1a3820;--sf2:#1e4226}
[data-theme="light"]{--ac:#16a34a;--ac2:#40c070;--bg0:#f0faf2;--bg1:#e0f4e4;--bg2:#f4fef6;--bg3:#fff;--ubbl:#d8f0dc;--sf1:#d0ecd4;--sf2:#c4e4c8}`,
sunset:`[data-theme="dark"]{--ac:#fb923c;--ac2:#ffb870;--bg0:#18100a;--bg1:#20160e;--bg2:#281c12;--bg3:#322418;--ubbl:#24180e;--sf1:#3a2818;--sf2:#44301c}
[data-theme="light"]{--ac:#ea580c;--ac2:#f08040;--bg0:#fffaf5;--bg1:#fef0e0;--bg2:#fff8f2;--bg3:#fff;--ubbl:#fce8d4;--sf1:#fae0cc;--sf2:#f4d8c0}`,
clear:''};

function load(){try{const d=localStorage.getItem('reunion');if(d){const p=JSON.parse(d);Object.assign(S,p);if(!S.cfg)S.cfg={base:'',key:'',models:['gpt-4o'],cur:'gpt-4o',tok:4096,temp:.7,uN:'',uA:'',aN:'助手',aA:'',gSys:''};if(!S.mem)S.mem=[];if(!S.chats)S.chats={};if(!S.anni)S.anni=[];if(S.css===undefined)S.css='';Object.values(S.chats).forEach(c=>{(c.msgs||[]).forEach((m,i)=>{if(!m.id)m.id='m'+i+'_'+rnd();if(!m.ts)m.ts=c.ts||Date.now()})})}}catch(e){}}
function sv(){try{localStorage.setItem('reunion',JSON.stringify(S))}catch(e){}}
function rnd(){return Math.random().toString(36).slice(2,8)}
function uid(){return Date.now().toString(36)+rnd()}
function fmtTime(ts){if(!ts)return'';const d=new Date(ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2500)}
function applyCSS(){Q('#custom-css').textContent=S.css||''}
function applyTheme(){document.documentElement.setAttribute('data-theme',S.theme);Q('#tTh').innerHTML=S.theme==='dark'?'<i class="fas fa-moon"></i>':'<i class="fas fa-sun"></i>'}
function toggleTheme(){S.theme=S.theme==='dark'?'light':'dark';applyTheme();sv()}
function openSide(){Q('#sidebar').classList.add('open');Q('#sov').classList.add('open')}
function closeSide(){Q('#sidebar').classList.remove('open');Q('#sov').classList.remove('open')}

function cc(){if(!S.cid||!S.chats[S.cid])newChat();return S.chats[S.cid]}
function newChat(){const id=uid();S.chats[id]={id,title:'新对话',msgs:[],sys:'',ts:Date.now()};S.cid=id;pf=[];sv();rL();rM();rF();uT();closeSide()}
function goChat(id){S.cid=id;pf=[];sv();rL();rM();rF();uT();closeSide()}
function delChat(id,ev){
  ev.stopPropagation();const btn=ev.currentTarget;
  if(btn.dataset.confirm){
    delete S.chats[id];
    if(S.cid===id){const k=Object.keys(S.chats);S.cid=k.length?k[k.length-1]:null}
    if(!Object.keys(S.chats).length)newChat();else{sv();rL();rM();uT()}
  }else{
    btn.dataset.confirm='1';btn.classList.add('confirm');btn.innerHTML='<i class="fas fa-check"></i> 确认';
    setTimeout(()=>{if(btn.isConnected){delete btn.dataset.confirm;btn.classList.remove('confirm');btn.innerHTML='<i class="fas fa-trash"></i>'}},3000)
  }}
function uT(){Q('#tbT').textContent=cc()?.title||'新对话'}

function addMem(t){if(!t||!t.trim())return false;t=t.trim();if(S.mem.some(m=>m.t===t))return false;S.mem.push({id:Date.now()+Math.random(),t});sv();rMem();uMB();return true}

function rCal(){
  const counts=getMsgCounts();const now=new Date();const todayStr=now.toISOString().slice(0,10);let h='';
  for(let i=0;i<12;i++){
    const dt=new Date(now.getFullYear(),now.getMonth()-i,1);const y=dt.getFullYear(),mo=dt.getMonth();
    const firstDay=new Date(y,mo,1).getDay();const days=new Date(y,mo+1,0).getDate();

    for(let j=0;j<firstDay;j++)h+='<div class="cal-mc empty"></div>';
    for(let d=1;d<=days;d++){const ds=`${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const n=counts[ds]||0;const lv=heatLv(n);const isT=ds===todayStr;h+=`<div class="cal-mc l${lv}${isT?' today':''}" data-d="${ds}" data-n="${n}">${d}</div>`}

async function sApi(msgs,signal){const base=S.cfg.base.replace(/\/+$/,'');return fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+S.cfg.key},body:JSON.stringify({model:S.cfg.cur,messages:msgs,stream:true,max_tokens:S.cfg.tok,temperature:S.cfg.temp}),signal})}

function greeting(){
  const h=new Date().getHours(),n=S.cfg.uN,ok=n&&n.length>0;
  let tg;if(h>=5&&h<12)tg='Good morning';else if(h>=12&&h<18)tg='Good afternoon';else if(h>=18&&h<22)tg='Good evening';else tg='Late night';
  const pool=[];
  if(ok){pool.push(`${tg}, ${n}`);pool.push(`Welcome back, ${n}`);pool.push(`I missed you, ${n}`);pool.push(`Nice to see you again, ${n}`);pool.push(`Hey there, ${n} ✨`);pool.push(`${n}, I'm here for you`);
    if(h>=22||h<5){pool.push(`Still up, ${n}?`);pool.push(`It's late, I'll stay with you, ${n}`)}
    if(h>=5&&h<9)pool.push(`A brand new day, ${n} ☀️`);
    if(h>=12&&h<14)pool.push(`Had lunch yet, ${n}?`)}
  else{pool.push(tg);pool.push('Hey there ✨');pool.push('Welcome back');pool.push("I'm here for you")}
  return pool[Math.floor(Math.random()*pool.length)]}

function onSendClick(){if(busy){if(ctrl)ctrl.abort();return}doSend(false)}

async function doSend(isRe){
  const c=cc();if(!c)return;
  if(!isRe){const inp=Q('#uIn');const txt=inp.value.trim();if(!txt&&!pf.length)return;let content=txt;const files=pf.map(f=>({name:f.name,img:f.img,data:f.img?f.data:null}));pf.forEach(f=>{content+=f.img?'\n[图片: '+f.name+']':'\n\n--- '+f.name+' ---\n'+f.data+'\n---'});c.msgs.push({id:'m_'+uid(),role:'user',content,files,ts:Date.now()});pf=[];inp.value='';inp.style.height='';rF();if(c.title==='新对话'&&txt){c.title=txt.slice(0,24)+(txt.length>24?'…':'');uT();rL()}}
  const last=c.msgs[c.msgs.length-1];if(!last||last.role!=='user')return;
  const api=[];let sys=(S.cfg.gSys||'').trim();const csys=(c.sys||'').trim();
  if(!sys&&!csys)sys='你是一个有用的AI助手。';if(sys&&csys)sys=sys+'\n\n'+csys;else if(csys)sys=csys;
  const now=new Date();const wd='日一二三四五六'[now.getDay()];
  sys+=`\n\n[当前时间] ${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${fmtTime(now.getTime())} 星期${wd}`;
  const todayStr=now.toISOString().slice(0,10);const counts=getMsgCounts();sys+=`\n[今日消息] ${counts[todayStr]||0}条`;
  const anniCtx=getAnniCtx();if(anniCtx)sys+=`\n[纪念日] ${anniCtx}`;
  if(S.mem.length)sys+='\n\n[你记住的关于用户的信息，请自然运用：]\n'+S.mem.map(m=>m.t).join('\n');
  sys+='\n\n[记忆工具] 当你需要记住关于用户的重要信息，或用户要求你记住时，在回复中使用 <save_memory>内容</save_memory> 。不需要记住时不使用。';
  if(S.tOn)sys+='\n\n[思考模式] 请先用 <think>...</think> 深入思考，然后给出正式回复。';
  api.push({role:'system',content:sys});c.msgs.forEach(m=>api.push({role:m.role,content:m.content}));
  let didS=false;if(S.sOn){const q=last.content.slice(0,80);if(q){const sr=await searchWeb(q);if(sr){api.push({role:'system',content:'[联网搜索结果：]\n'+sr});didS=true}}}
  const aM={id:'m_'+uid(),role:'assistant',content:'',thinking:'',model:S.cfg.cur,searched:didS,memSaved:false,ts:Date.now()};c.msgs.push(aM);sv();rM();
  busy=true;ctrl=new AbortController();uSnd();
  try{const res=await sApi(api,ctrl.signal);if(!res.ok)throw new Error('API '+res.status+': '+(await res.text()).slice(0,200));
    const reader=res.body.getReader();const dec=new TextDecoder();let full='',buf='';
    while(true){const{done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop()||'';
      for(const line of lines){const t=line.trim();if(!t||t==='data: [DONE]'||!t.startsWith('data: '))continue;
        try{const j=JSON.parse(t.slice(6));const d=j.choices?.[0]?.delta?.content;if(!d)continue;full+=d;
        if(S.tOn){const te=full.indexOf('</think>');if(te!==-1){const ts2=full.indexOf('<think>');aM.thinking=full.slice(ts2!==-1?ts2+7:0,te).trim();aM.content=full.slice(te+8).trim()}else if(full.includes('<think>')){aM.thinking=full.slice(full.indexOf('<think>')+7);aM.content=''}else aM.content=full}else aM.content=full;
        sUpd(aM)}catch(e){}}}
    aM.ts=Date.now();const all=aM.content+(aM.thinking?'\n'+aM.thinking:'');const rx=/<save_memory>([\s\S]*?)<\/save_memory>/g;let mm;const mms=[];
    while((mm=rx.exec(all))!==null)mms.push(mm[1].trim());
    aM.content=aM.content.replace(/<save_memory>[\s\S]*?<\/save_memory>/g,'').trim();
    if(aM.thinking)aM.thinking=aM.thinking.replace(/<save_memory>[\s\S]*?<\/save_memory>/g,'').trim();
    if(mms.length){mms.forEach(m=>addMem(m));aM.memSaved=true}rM();
  }catch(e){if(e.name!=='AbortError'){aM.content='请求失败：'+e.message;rM()}}
  finally{busy=false;ctrl=null;uSnd();sv()}}

function rL(){
  const el=Q('#chatList');const sorted=Object.values(S.chats).sort((a,b)=>b.ts-a.ts);
  const g={};sorted.forEach(c=>{const d=new Date(c.ts);const n=new Date();let l;if(d.toDateString()===n.toDateString())l='今天';else if(d.toDateString()===new Date(n-864e5).toDateString())l='昨天';else l=`${d.getMonth()+1}月${d.getDate()}日`;if(!g[l])g[l]=[];g[l].push(c)});
  let h='';Object.entries(g).forEach(([l,cs])=>{h+=`<div class="cl-date">${l}</div>`;cs.forEach(c=>{h+=`<div class="cl-item ${c.id===S.cid?'on':''}" onclick="goChat('${c.id}')"><span class="ci"><i class="fas fa-message"></i></span><span class="ct">${esc(c.title)}</span><button class="cx" onclick="delChat('${c.id}',event)"><i class="fas fa-trash"></i></button></div>`})});el.innerHTML=h}

function bMsg(m){
  const isU=m.role==='user';
  const av=isU?(S.cfg.uA?`<img src="${S.cfg.uA}">`:'<i class="fas fa-user"></i>'):(S.cfg.aA?`<img src="${S.cfg.aA}">`:'<i class="fas fa-robot"></i>');
  const name=isU?(S.cfg.uN||'用户'):(S.cfg.aN||'助手');
  const model=(!isU&&m.model)?`<span class="m-model">${esc(m.model)}</span>`:'';
  const time=fmtTime(m.ts);let body='';
  if(isU){let d=m.content||'';const ci=[d.indexOf('\n[图片:'),d.indexOf('\n\n--- ')].filter(x=>x!==-1);if(ci.length)d=d.slice(0,Math.min(...ci));body=esc(d).replace(/\n/g,'<br>');
    if(m.files&&m.files.length){body+='<div class="m-files">';m.files.forEach(f=>{body+=f.img&&f.data?`<span class="m-file"><img src="${f.data}"> ${esc(f.name)}</span>`:`<span class="m-file"><i class="fas fa-file-alt"></i> ${esc(f.name)}</span>`});body+='</div>'}}
  else{if(m.searched)body+='<div class="bdg-s"><i class="fas fa-globe"></i> 已联网搜索</div>';
    if(m.thinking)body+=`<div class="think"><div class="think-h on" onclick="this.classList.toggle('on');this.nextElementSibling.classList.toggle('on')"><i class="fas fa-caret-right ar"></i> 思考过程</div><div class="think-b on">${esc(m.thinking)}</div></div>`;
    if(m.content){try{body+=marked.parse(m.content)}catch(e){body+=esc(m.content)}}
    else if(busy&&m===cc().msgs[cc().msgs.length-1])body+=`<div class="gen"><div class="gd"><span></span><span></span><span></span></div>正在生成…</div>`;
    if(m.memSaved)body+='<div class="bdg-m"><i class="fas fa-check-circle"></i> 记忆已更新</div>'}
  let acts='';
  if(isU)acts=`<div class="m-acts"><button class="ma" onclick="startEdit('${m.id}')"><i class="fas fa-pen"></i> 编辑</button><button class="ma rd" onclick="delMsg('${m.id}')"><i class="fas fa-trash"></i> 删除</button></div>`;
  else acts=`<div class="m-acts"><button class="ma" onclick="regen('${m.id}')"><i class="fas fa-rotate"></i> 重新生成</button><button class="ma" onclick="startEdit('${m.id}')"><i class="fas fa-pen"></i> 编辑</button><button class="ma rd" onclick="delMsg('${m.id}')"><i class="fas fa-trash"></i> 删除</button></div>`;
  const eb=`<div class="ebox" id="eb_${m.id}"><textarea>${esc(m.content||'')}</textarea><div class="ebox-b"><button class="eb-no" onclick="cancelEdit('${m.id}')">取消</button><button class="eb-ok" onclick="saveEdit('${m.id}')">保存</button></div></div>`;
  return`<div class="message ${isU?'u':'a'}" data-id="${m.id}"><div class="msg-row"><div class="m-av ${isU?'uav':'aav'}">${av}</div><div class="m-body"><div class="m-head"><span class="m-name">${esc(name)}</span>${model}<span class="m-time">${time}</span></div><div class="m-text">${body}</div>${acts}${eb}</div></div></div>`}

function sUpd(m){
  const el=document.querySelector(`.message[data-id="${m.id}"] .m-text`);if(!el)return;let h='';
  if(m.searched)h+='<div class="bdg-s"><i class="fas fa-globe"></i> 已联网搜索</div>';
  if(m.thinking)h+=`<div class="think"><div class="think-h on" onclick="this.classList.toggle('on');this.nextElementSibling.classList.toggle('on')"><i class="fas fa-caret-right ar"></i> 思考过程</div><div class="think-b on">${esc(m.thinking)}</div></div>`;
  if(m.content){try{h+=marked.parse(m.content)}catch(e){h+=esc(m.content)}h+='<span class="cur"></span>'}
  else h+=`<div class="gen"><div class="gd"><span></span><span></span><span></span></div>正在生成…</div>`;

;(function(){

  function dn(e){e.preventDefault();drag=true;sy=e.clientY||(e.touches&&e.touches[0].clientY);sh=a.offsetHeight;
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);document.addEventListener('touchmove',mv,{passive:false});document.addEventListener('touchend',up)}

  function up(){drag=false;document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);document.removeEventListener('touchmove',mv);document.removeEventListener('touchend',up)}
  h.addEventListener('mousedown',dn);h.addEventListener('touchstart',dn,{passive:false})})();
